# ============================================================
# Alembic - configuración de SIPA
# ------------------------------------------------------------
# La URL de conexión NO se define aquí: env.py la toma de
# app.core.config.settings.DATABASE_URL (variable de entorno
# DATABASE_URL). Así no hay credenciales en el repositorio.
# Todos los comandos se ejecutan desde el directorio backend/
# (en el contenedor: /app).
# ============================================================

[alembic]
# Carpeta con env.py, script.py.mako y versions/
script_location = %(here)s/alembic

# Permite "import app..." desde env.py (el directorio actual, backend/)
prepend_sys_path = .

# Nombre de archivo ordenable por fecha: 20261024_2130_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Longitud máxima del "slug" del nombre de archivo
truncate_slug_length = 40

# sqlalchemy.url se deja vacío a propósito (ver env.py)
sqlalchemy.url =

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
